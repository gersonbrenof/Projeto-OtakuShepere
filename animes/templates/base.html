{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script> 
<title>{% block title%} {%endblock%}</title>
  </head>
  <body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Otaku Shepere</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'anime'%}" id="Anime">Anime</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="" id="Manwar">Manwar</a>
                    </li>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="" id="Manga">Manga</a>
                </li>
                </ul>
                <form class="top-0 end-0 m-0 bg-light border rounded p-0 shadow" action="{% url 'pesquisar' %}" method="GET" style="width: 200px;">
                    <div class="input-group">
                    <input type="text" class="form-control" name="keyword" placeholder="Pesquisar animes" required>
                    <button class="btn btn-success" type="submit">
                     <i class="fas fa-search"></i>
                    </button>
                        </div>
                            </form>
                <div class="dropdown ml-auto">
                    <button class="btn btn-secondary dropdown-toggle rounded shadow" type="button" id="dropdownMenuButton" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false" >
                        <div style="display: flex; align-items: center;">
                          
                        </div>
                    </button>
                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                        <a class="dropdown-item" href="">Meu Perfil</a>
                            <a class="dropdown-item" href="">Sair</a>
                       
                            <a class="dropdown-item" href="">Login</a>
                            <a class="dropdown-item" href="">Cadastrar-se</a>
                     
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var navbarToggler = document.querySelector(".navbar-toggler");
            var navbarNav = document.querySelector("#navbarNav");

            navbarToggler.addEventListener("click", function() {
                navbarNav.classList.toggle("show");
            });
        });
    </script>
 
    
      {% block content %}
    
      {% endblock %}
    
     
    <footer class="footer bg-dark text-white">
      <div class="container">
          <div class="row">

              <div class="col-md-1 text-center mb-2">
                  <a href="https://github.com/gersonbreno" target="_blank" class="text-white text-decoration-none">
                      <img src="https://i.ytimg.com/vi/WYNWFhTdPQc/maxresdefault.jpg" alt="GitHub" class="img-fluid" style="max-width: 30px;">
                      <p class="mt-2">GitHub</p>
                  </a>
              </div>

              <div class="col-md-1 text-center mb-2">
                  <a href="https://www.facebook.com/profile.php?id=100013071375573" target="_blank" class="text-white text-decoration-none">
                      <img src="https://files.tecnoblog.net/wp-content/uploads/2022/02/facebook-logotipo.png" alt="Facebook" class="img-fluid text-decoration-none" style="max-width: 30px;">
                      <p class="mt-2">Facebook</p>
                  </a>
              </div>
          </div>
      </div>
  </footer>
  <div class="container mt-5">
    <title>Comentários</title>
</head>
<body>

<style>
    .user-avatar {
        display: inline-block;
        width: 30px;
        height: 30px;
        line-height: 30px;
        text-align: center;
        border-radius: 50%;
        background-color: #007bff; /* Cor de fundo da bola redonda */
        color: #fff; /* Cor do texto da bola redonda */
    }
</style>

</html>
